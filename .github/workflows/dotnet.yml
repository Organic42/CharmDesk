# Builds CharmDesk on every push/PR to main and publishes the result as a downloadable artifact.
#
# Runs on windows-latest, not ubuntu: CharmDesk is a WPF app targeting net8.0-windows10.0.17763.0,
# which needs the Windows Desktop SDK and cannot build on Linux at all.
name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/CharmDesk.sln

    - name: Build
      run: dotnet build src/CharmDesk.sln -c Release --no-restore

    # No test step: the project has no automated tests yet. Add one here alongside the first
    # test project rather than leaving a step that can only ever fail or no-op.

    - name: Publish
      run: dotnet publish src/CharmDesk/CharmDesk.csproj -c Release -o publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: CharmDesk-win-x64
        path: publish/
        retention-days: 14
